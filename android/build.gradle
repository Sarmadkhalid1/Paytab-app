buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        // Keep Kotlin pinned to 2.0.21: RN 0.77's `com.facebook.react` gradle
        // plugin was compiled against KGP 2.0.x where `KotlinTopLevelExtension`
        // is a class; KGP 2.1+ changed it to an interface, breaking the plugin.
        // PayTabs SDK 6.8.10 ships stdlib/serialization compiled with Kotlin
        // 2.2.x — we handle that via `-Xskip-metadata-version-check` below
        // and a forced kotlin-stdlib version.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // androidx.core 1.17+ requires AGP 8.9.1 / compileSdk 36; pin to
            // the last 1.16.x compatible with AGP 8.7.2 shipped by RN 0.77.
            if (details.requested.group == 'androidx.core' &&
                    (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
                details.useVersion '1.16.0'
                details.because 'AGP 8.7.2 / compileSdk 36 compatibility'
            }
            // PayTabs SDK 6.8.10 transitively pulls kotlin-stdlib 2.2.10, whose
            // metadata version (2.2.0) crashes the Kotlin 2.0.21 K2 compiler.
            // Pin stdlib to match our compiler.
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    (details.requested.name == 'kotlin-stdlib' ||
                     details.requested.name == 'kotlin-stdlib-jdk7' ||
                     details.requested.name == 'kotlin-stdlib-jdk8' ||
                     details.requested.name == 'kotlin-stdlib-common' ||
                     details.requested.name == 'kotlin-reflect')) {
                details.useVersion rootProject.ext.kotlinVersion
                details.because 'Align kotlin-stdlib with compiler (2.0.21) to avoid metadata 2.2.0 vs 2.0.0 mismatch'
            }
        }
    }

    // Some transitive libs (e.g. okhttp 5.x, kotlinx-serialization 1.9.0) are
    // still compiled with Kotlin 2.2.x metadata. Tell our 2.0.21 compiler not
    // to fail on the metadata version check when reading those .class files.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            freeCompilerArgs.addAll(["-Xskip-metadata-version-check"])
        }
    }
}

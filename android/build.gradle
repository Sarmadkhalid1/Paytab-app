buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        // androidx.core 1.17+ (PayTabs SDK) requires AGP 8.9.1+ → Gradle 8.11.1+
        agpVersion = "8.9.2"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agpVersion}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // PayTabs SDK 6.8.10 needs WindowCompat.enableEdgeToEdge (androidx.core 1.17+).
            if (details.requested.group == 'androidx.core' &&
                    (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
                details.useVersion '1.18.0'
                details.because 'PayTabs SDK requires WindowCompat.enableEdgeToEdge'
            }

            // PayTabs pulls kotlin-stdlib 2.2.x; align with our Kotlin 2.0.21 compiler.
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    (details.requested.name == 'kotlin-stdlib' ||
                     details.requested.name == 'kotlin-stdlib-jdk7' ||
                     details.requested.name == 'kotlin-stdlib-jdk8' ||
                     details.requested.name == 'kotlin-stdlib-common' ||
                     details.requested.name == 'kotlin-reflect')) {
                details.useVersion rootProject.ext.kotlinVersion
                details.because 'Align kotlin-stdlib with compiler (2.0.21)'
            }
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            freeCompilerArgs.addAll(["-Xskip-metadata-version-check"])
        }
    }
}
